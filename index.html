<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Noticias">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icono.png">
<link rel="icon" href="icono.png">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Noticias Chile x4</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:system-ui,sans-serif;color:#eee}
  body.idle{cursor:none}
  #grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;width:100vw;height:100vh;height:100dvh}
  html,body{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  .cell{position:relative;overflow:hidden;background:#000}
  .cell iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .setup{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;padding:16px;background:#111;z-index:2}
  .setup h3{font-size:15px;font-weight:600;color:#aaa}
  .chs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:min(560px,100%)}
  .chs button{background:#1f2a3a;padding:10px 6px}
  .chs button.on{background:#2d6cdf}
  .row{display:flex;gap:6px;width:min(560px,100%)}
  .setup input{flex:1;min-width:0;padding:9px 10px;border-radius:6px;border:1px solid #444;background:#1c1c1c;color:#fff;font-size:14px}
  button{cursor:pointer;border:0;border-radius:6px;padding:9px 14px;font-size:14px;background:#2d6cdf;color:#fff}
  button.sec{background:#333}
  .hint{font-size:12px;color:#888;text-align:center;max-width:560px;line-height:1.5}
  .hint a{color:#9cf}
  .tools{position:absolute;top:8px;right:8px;display:flex;gap:6px;z-index:3;transition:opacity .3s}
  .tools button{padding:5px 9px;font-size:13px;background:rgba(0,0,0,.65)}
  .cell.audio .tools .snd{background:#2d6cdf}
  body.idle .tools,body.idle #bar{opacity:0;pointer-events:none}
  #bar{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:5;display:flex;gap:6px;transition:opacity .3s}
  #bar button{background:rgba(0,0,0,.7);font-size:13px;padding:7px 12px}
  .yt,.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .tools .lbl{align-self:center;font-size:12px;background:rgba(0,0,0,.65);padding:5px 8px;border-radius:6px}
  .tap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:2;background:rgba(0,0,0,.4)}
  #tapAll{position:fixed;inset:0;z-index:8;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.35)}
  #tapAll button{font-size:18px;padding:14px 22px}
  /* pantalla con audio */
  .cell{transition:box-shadow .25s}
  .cell.audio{box-shadow:inset 0 0 0 3px #2d6cdf}
  .badge{position:absolute;left:8px;top:8px;z-index:3;background:#2d6cdf;color:#fff;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600;display:none;pointer-events:none}
  .cell.audio .badge{display:block;animation:pulse 1.6s ease-in-out 2}
  body.muted .cell.audio{box-shadow:inset 0 0 0 3px #777}
  body.muted .cell.audio .badge{background:#555}
  @keyframes pulse{50%{transform:scale(1.12)}}
  /* layout destacado: la pantalla con audio grande a la izquierda, las otras 3 a la derecha */
  body.focus #grid{grid-template-columns:3fr 1fr;grid-template-rows:1fr 1fr 1fr}
  body.focus .cell.audio{grid-column:1;grid-row:1 / 4}
  body.focus .cell:not(.audio){grid-column:2}
  /* control central */
  #hub{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;width:216px;padding:10px;border-radius:20px;
       background:rgba(14,18,26,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 8px 30px rgba(0,0,0,.6);
       border:1px solid rgba(255,255,255,.08);transition:opacity .35s,transform .25s,left .3s,top .3s;touch-action:manipulation}
  body.focus #hub{left:37.5%;top:auto;bottom:62px;transform:translateX(-50%)}
  body.idle #hub{opacity:.28}
  #hub.min{width:auto;padding:0;border-radius:999px}
  #hub.min .full{display:none}
  #hub .mini{display:none;width:56px;height:56px;border-radius:999px;font-size:24px;background:#2d6cdf}
  #hub.min .mini{display:block}
  #hub .map{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  #hub .q{position:relative;height:64px;padding:6px;border-radius:12px;background:#1f2633;color:#cfd6e4;display:flex;flex-direction:column;
          align-items:center;justify-content:center;gap:2px;font-size:12px;line-height:1.15;text-align:center;transition:background .2s,transform .1s}
  #hub .q b{font-size:18px}
  #hub .q:active{transform:scale(.95)}
  #hub .q.on{background:#2d6cdf;color:#fff}
  #hub .q.on::after{content:"🔊";position:absolute;top:4px;right:6px;font-size:12px}
  body.muted #hub .q.on{background:#555}
  #hub .row2{display:flex;gap:6px;margin-top:8px;align-items:center}
  #hub .row2 button{flex:none;width:40px;height:40px;padding:0;border-radius:10px;background:#1f2633;font-size:17px}
  #hub .row2 button.act{background:#2d6cdf}
  #hub input[type=range]{flex:1;min-width:0;accent-color:#2d6cdf;height:28px}
  #hub .hint2{margin-top:6px;font-size:11px;color:#8792a6;text-align:center}
  #toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:9;background:rgba(0,0,0,.8);padding:8px 14px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none}
  #toast.show{opacity:1}
  #warn{position:fixed;inset:0;z-index:9;background:#111;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;line-height:1.6}
</style>
</head>
<body>
<div id="grid"></div>
<div id="bar">
  <button id="fs">⛶ Pantalla completa (F)</button>
  <button id="editAll" class="sec">✎ Cambiar canales (E)</button>
</div>
<div id="hub">
  <button class="mini" title="Mostrar control de audio">🔊</button>
  <div class="full">
    <div class="map" id="map"></div>
    <div class="row2">
      <button id="mute" title="Silenciar todo (M)">🔇</button>
      <input id="vol" type="range" min="0" max="100" step="5" aria-label="Volumen">
      <button id="lay" title="Agrandar la pantalla con audio (G)">⛶</button>
      <button id="hide" title="Achicar este control">✕</button>
    </div>
    <div class="hint2">Toca una pantalla para escucharla · doble toque = agrandar</div>
  </div>
</div>
<div id="toast"></div>
<div id="tapAll"><button>▶ Tocar para iniciar los videos</button></div>
<div id="warn"><div>Esta página se abrió como archivo y YouTube la bloquea (Error 153).<br>Ciérrala y ábrela con <b>Abrir Noticias.bat</b>, que está en la misma carpeta.</div></div>

<script>
// Canales de noticias de Chile en YouTube (ID de canal; se muestra su transmisión en vivo actual)
const CANALES = [
  // vids = videos en vivo conocidos (9 oct 2026); se prueban si no se puede averiguar el actual
  {n:"24 Horas (TVN)", id:"UCTXNz3gjAypWp3EhlIATEJQ", vids:["R1zazWO2How","3JM61yuIzS4"]},
  {n:"T13", id:"UCsRnhjcUCR78Q3Ud6OXCTNg", vids:["8eIYlB__Z4k","oy1dvCRd42s"]},
  {n:"CNN Chile", id:"UCpOAcjJNAp0Y0fhznRrXIJQ", vids:["Fgdw807FSl8"]},
  {n:"Meganoticias", id:"UCkccyEbqhhM3uKOI6Shm-4Q", vids:["TOObJ46ujPg","0-T-97RbSV8"]},
  {n:"CHV Noticias", id:"UCRsUoZYC1ULUspipMRnMhwg", vids:["C_P66PCQK3k"]},
  {n:"BioBío TV", id:"UCUyXwD-J--EZlv90KHyqOUg", vids:["akuL1FgEUmM"]}
];
const KEY = "noticias4_v2";
let urls = CANALES.slice(0,4).map(c=>c.id);
try { const s = JSON.parse(localStorage.getItem(KEY)); if (Array.isArray(s) && s.length===4) urls = s; } catch(e){}
let audioIdx = 0;

if (location.protocol === "file:") document.getElementById("warn").style.display = "flex";

function toEmbed(input){
  const s = (input||"").trim();
  if(!s) return null;
  const p = "autoplay=1&mute=1&controls=0&rel=0&modestbranding=1&playsinline=1&iv_load_policy=3&disablekb=1&enablejsapi=1&origin=" + encodeURIComponent(location.origin);
  let m = s.match(/(?:v=|youtu\.be\/|\/live\/|\/embed\/|\/shorts\/)([\w-]{11})/) || s.match(/^([\w-]{11})$/);
  if (m) return "https://www.youtube.com/embed/" + m[1] + "?" + p;
  m = s.match(/(UC[\w-]{22})/);
  if (m) return "https://www.youtube.com/embed/live_stream?channel=" + m[1] + "&" + p;
  if (/^https?:\/\//.test(s)) return s;
  return null;
}

const grid = document.getElementById("grid");
const cells = [];
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(urls)); }catch(e){} }

function ytCmd(i, func, args){
  const f = cells[i].querySelector("iframe");
  if (f && f.src.includes("youtube")) f.contentWindow.postMessage(JSON.stringify({event:"command",func,args:args||[]}), "*");
}
// ---- Audio: una sola pantalla suena a la vez ----
const players = [];          // pantalla -> YT.Player
const PREF = "noticias4_pref";
let pref = {audio:0, vol:100, muted:false, focus:false, min:false};
try { Object.assign(pref, JSON.parse(localStorage.getItem(PREF)) || {}); } catch(e){}
function savePref(){ try{ localStorage.setItem(PREF, JSON.stringify(pref)); }catch(e){} }
audioIdx = Math.min(3, Math.max(0, +pref.audio || 0));

function applyAudio(j){
  const p = players[j], on = (j === audioIdx && !pref.muted);
  try {
    if (p && p.mute) { if (on) { p.unMute(); p.setVolume(pref.vol); } else p.mute(); }
    else { if (on) { ytCmd(j,"unMute"); ytCmd(j,"setVolume",[pref.vol]); } else ytCmd(j,"mute"); }
  } catch(e){}
}
function setAudio(i, silent){
  audioIdx = i; pref.audio = i;
  if (pref.muted) { pref.muted = false; }
  savePref();
  cells.forEach((c,j)=>{ c.classList.toggle("audio", j===i); applyAudio(j); });
  updateHub();
  if (!silent) toast("🔊 Pantalla " + (i+1) + " · " + nombrePantalla(i));
}
function toggleMute(){
  pref.muted = !pref.muted; savePref();
  cells.forEach((_,j)=>applyAudio(j)); updateHub();
  toast(pref.muted ? "🔇 Todo en silencio" : "🔊 Sonido activado");
}
function setVol(v){ pref.vol = Math.max(0, Math.min(100, v)); savePref(); applyAudio(audioIdx); updateHub(); }
function toggleFocus(){ pref.focus = !pref.focus; savePref(); updateHub(); toast(pref.focus ? "⛶ Pantalla " + (audioIdx+1) + " agrandada" : "▦ Cuatro pantallas iguales"); }

function nombrePantalla(i){
  const id = showing[i] || urls[i];
  const c = CANALES.find(x=>x.id===id);
  return c ? c.n : (urls[i] ? "Video" : "Vacía");
}
let tt;
function toast(msg){ const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(tt); tt = setTimeout(()=>t.classList.remove("show"), 1600); }

function updateHub(){
  document.body.classList.toggle("muted", !!pref.muted);
  document.body.classList.toggle("focus", !!pref.focus);
  const hub = document.getElementById("hub"); hub.classList.toggle("min", !!pref.min);
  const map = document.getElementById("map");
  map.innerHTML = [0,1,2,3].map(j =>
    `<button class="q ${j===audioIdx?'on':''}" data-j="${j}"><b>${j+1}</b><span>${nombrePantalla(j)}</span></button>`).join("");
  map.querySelectorAll(".q").forEach(b=>{
    let last = 0;
    b.onclick = ()=>{
      const j = +b.dataset.j, now = Date.now();
      if (now - last < 350 && j === audioIdx) { toggleFocus(); last = 0; return; }   // doble toque
      last = now;
      if (j !== audioIdx || pref.muted) setAudio(j);
    };
  });
  document.getElementById("vol").value = pref.vol;
  document.getElementById("mute").classList.toggle("act", !!pref.muted);
  document.getElementById("mute").textContent = pref.muted ? "🔈" : "🔇";
  document.getElementById("lay").classList.toggle("act", !!pref.focus);
  cells.forEach((c,j)=>{ const b = c.querySelector(".badge"); if (b) b.textContent = (pref.muted ? "🔇 " : "🔊 ") + nombrePantalla(j); });
}

// ---- Reproducción con respaldo automático ----
// Para cada pantalla se arma una lista de opciones (video en vivo actual, últimos videos conocidos,
// transmisión del canal y, si nada funciona, otros canales). Si una opción da error o no empieza
// a reproducirse en 20 s (por ejemplo "no disponible" o "comenzará en X días"), se pasa a la siguiente.
const YT_READY = new Promise(res => {
  window.onYouTubeIframeAPIReady = res;
  const sc = document.createElement("script"); sc.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(sc);
});
const isCh = s => /^UC[\w-]{22}$/.test(s||"");
const isVid = s => /^[\w-]{11}$/.test(s||"");
const showing = {};   // pantalla -> id de canal que se está mostrando
const token = [0,0,0,0];
let anyPlaying = false;

let _lj;
function liveJson(){
  if (!_lj) _lj = fetch("live.json?t=" + Date.now(), {cache:"no-store"}).then(r=>r.ok ? r.json() : null).catch(()=>null);
  return _lj;
}
async function opcionesCanal(ch){
  const c = CANALES.find(x=>x.id===ch) || {n:"", id:ch};
  const out = [];
  const lj = await liveJson();
  if (lj && isVid(lj[ch])) out.push(lj[ch]);
  if (location.hostname === "localhost") {
    try { const v = (await fetch("/live?ch=" + ch).then(r=>r.ok ? r.text() : "")).trim(); if (isVid(v)) out.push(v); } catch(e){}
  }
  (c.vids || []).forEach(v=> out.push(v));
  out.push(ch); // transmisión en vivo del canal
  return [...new Set(out)].map(src => ({src, ch, n:c.n}));
}
async function opciones(i){
  const u = urls[i];
  if (!isCh(u)) return [{src:u, ch:null, n:""}];
  let list = await opcionesCanal(u);
  // respaldo: otros canales que no estén en otra pantalla
  for (const c of CANALES) if (!urls.includes(c.id)) list = list.concat(await opcionesCanal(c.id));
  return list;
}

function render(i){
  const c = cells[i];
  const my = ++token[i];
  c.innerHTML = "";
  delete showing[i];
  if (!toEmbed(urls[i])) return showSetup(i);
  opciones(i).then(list => probar(i, list, 0, my));
}

function probar(i, list, k, my){
  if (my !== token[i]) return;
  const c = cells[i];
  // saltar canales de respaldo que ya se están mostrando en otra pantalla
  while (k < list.length && list[k].ch && list[k].ch !== urls[i] &&
         Object.entries(showing).some(([j,ch]) => +j !== i && ch === list[k].ch)) k++;
  if (k >= list.length) { // nada funcionó: dejamos la primera opción y un botón para reintentar
    c.querySelector(".tap")?.remove();
    const b = document.createElement("div"); b.className = "tap";
    b.innerHTML = '<button>▶ Tocar para reproducir / reintentar</button>';
    b.onclick = ()=> render(i);
    c.appendChild(b); return;
  }
  const op = list[k];
  c.querySelectorAll("iframe,.tools,.tap,.yt").forEach(e=>e.remove());
  showing[i] = op.ch || urls[i];
  const holder = document.createElement("div"); holder.className = "yt";
  const f = document.createElement("iframe");
  f.src = toEmbed(op.src);
  f.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
  f.referrerPolicy = "strict-origin-when-cross-origin";
  holder.appendChild(f); c.appendChild(holder);

  let done = false;
  const siguiente = ()=>{ if (done || my !== token[i]) return; done = true; clearTimeout(timer); probar(i, list, k+1, my); };
  const timer = setTimeout(siguiente, 20000);
  YT_READY.then(()=> {
    if (my !== token[i]) return;
    players[i] = new YT.Player(f, { events: {
      onReady: ev => { try { ev.target.mute(); ev.target.playVideo(); } catch(e){} },
      onStateChange: ev => {
        if (ev.data === 1 && !done) { done = true; anyPlaying = true; clearTimeout(timer); applyAudio(i); updateHub(); }
        if (ev.data === 0) setTimeout(()=> { if (my === token[i]) render(i); }, 5000); // terminó la transmisión: buscar de nuevo
      },
      onError: siguiente
    }});
  });

  const t = document.createElement("div");
  t.className = "tools";
  const nombre = (op.ch && op.ch !== urls[i]) ? '<span class="lbl">' + op.n + '</span>' : '';
  t.innerHTML = nombre + '<button class="snd" title="Escuchar este (tecla '+(i+1)+')">🔊 '+(i+1)+'</button><button class="rl" title="Recargar">⟳</button><button class="ed" title="Cambiar canal">✎</button>';
  t.querySelector(".snd").onclick = ()=> setAudio(i);
  t.querySelector(".rl").onclick = ()=>{ _lj = null; render(i); };
  t.querySelector(".ed").onclick = ()=> showSetup(i);
  c.appendChild(t);
  const bd = document.createElement("div"); bd.className = "badge"; c.appendChild(bd);
  updateHub();
}

// Si el iPad no deja que los videos partan solos (p. ej. modo de bajo consumo), un toque los inicia.
setTimeout(()=>{ if (!anyPlaying) document.getElementById("tapAll").style.display = "flex"; }, 12000);

function showSetup(i){
  const c = cells[i];
  c.querySelector(".setup")?.remove();
  const d = document.createElement("div");
  d.className = "setup";
  const cur = urls[i];
  const isLink = !CANALES.some(ch=>ch.id===cur);
  d.innerHTML = `
    <h3>Pantalla ${i+1}: elige un canal</h3>
    <div class="chs">${CANALES.map((ch,k)=>`<button data-k="${k}" class="${ch.id===cur?'on':''}">${ch.n}</button>`).join("")}</div>
    <div class="row"><input placeholder="…o pega un link de YouTube" value="${isLink ? cur.replace(/"/g,'&quot;') : ''}"><button class="ok">OK</button></div>
    <p class="hint">Si un canal sale "no disponible", es que en ese momento tiene otra transmisión principal.
      Abre <a target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=noticias+chile+en+vivo&sp=EgJAAQ%253D%253D">los en vivo de Chile ↗</a>,
      copia el link del video que quieras y pégalo arriba.</p>
    ${cur ? '<button class="sec cancel">Cancelar</button>' : ''}`;
  d.querySelectorAll(".chs button").forEach(b=> b.onclick = ()=>{ urls[i]=CANALES[+b.dataset.k].id; save(); render(i); });
  const inp = d.querySelector("input");
  const ok = ()=>{ if(!toEmbed(inp.value)){ inp.style.borderColor="#d44"; return; } urls[i]=inp.value.trim(); save(); render(i); };
  d.querySelector(".ok").onclick = ok;
  inp.addEventListener("keydown", e=>{ e.stopPropagation(); if(e.key==="Enter") ok(); });
  d.querySelector(".cancel")?.addEventListener("click", ()=> d.remove());
  c.appendChild(d);
}

for (let i=0;i<4;i++){ const c=document.createElement("div"); c.className="cell"; grid.appendChild(c); cells.push(c); }
cells.forEach((_,i)=>render(i));
cells[audioIdx].classList.add("audio");
updateHub();
document.getElementById("mute").onclick = toggleMute;
document.getElementById("lay").onclick = toggleFocus;
document.getElementById("vol").oninput = e => setVol(+e.target.value);
document.getElementById("hide").onclick = ()=>{ pref.min = true; savePref(); updateHub(); };
document.querySelector("#hub .mini").onclick = ()=>{ pref.min = false; savePref(); updateHub(); };

function toggleFS(){ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(()=>{}); }
const fsOK = !!document.documentElement.requestFullscreen;
if (!fsOK || navigator.standalone || matchMedia("(display-mode: standalone)").matches) document.getElementById("fs").style.display = "none";
document.getElementById("fs").onclick = toggleFS;
document.getElementById("tapAll").onclick = ()=>{ document.getElementById("tapAll").style.display="none"; cells.forEach((_,i)=>render(i)); };
document.getElementById("editAll").onclick = ()=> cells.forEach((_,i)=>showSetup(i));
document.addEventListener("keydown", e=>{
  if (e.key==="f"||e.key==="F") toggleFS();
  if (e.key==="e"||e.key==="E") cells.forEach((_,i)=>showSetup(i));
  if (["1","2","3","4"].includes(e.key)) setAudio(+e.key-1);
  if (e.key==="m"||e.key==="M") toggleMute();
  if (e.key==="g"||e.key==="G") toggleFocus();
  if (e.key==="ArrowUp") setVol(pref.vol+10);
  if (e.key==="ArrowDown") setVol(pref.vol-10);
  if (e.key==="ArrowRight") setAudio((audioIdx+1)%4);
  if (e.key==="ArrowLeft") setAudio((audioIdx+3)%4);
});

let tm;
function wake(){ document.body.classList.remove("idle"); clearTimeout(tm); tm=setTimeout(()=>document.body.classList.add("idle"), ("ontouchend" in document) ? 5000 : 2500); }
document.addEventListener("mousemove", wake);
document.addEventListener("touchstart", wake, {passive:true});
wake();
</script>
</body>
</html>
