name: Actualizar en vivo
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Buscar videos en vivo
        shell: python
        run: |
          import json, re, urllib.request
          CANALES = {
            "UCTXNz3gjAypWp3EhlIATEJQ": "24 Horas", "UCsRnhjcUCR78Q3Ud6OXCTNg": "T13",
            "UCpOAcjJNAp0Y0fhznRrXIJQ": "CNN Chile", "UCkccyEbqhhM3uKOI6Shm-4Q": "Meganoticias",
            "UCRsUoZYC1ULUspipMRnMhwg": "CHV Noticias", "UCUyXwD-J--EZlv90KHyqOUg": "BioBio TV"}
          H = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36",
               "Cookie": "CONSENT=YES+cb; SOCS=CAI", "Accept-Language": "es-CL,es"}
          try: data = json.load(open("live.json"))
          except Exception: data = {}
          for ch, nombre in CANALES.items():
              try:
                  h = urllib.request.urlopen(urllib.request.Request(f"https://www.youtube.com/channel/{ch}/live", headers=H), timeout=20).read().decode("utf-8", "ignore")
              except Exception as e:
                  print(nombre, "error:", e); continue
              if "ytInitialData" not in h:
                  print(nombre, "YouTube no entregó la página; se mantiene el dato anterior"); continue
              m = (re.search(r'rel="canonical" href="https://www\.youtube\.com/watch\?v=([\w-]{11})"', h)
                   or re.search(r'"videoDetails":\{"videoId":"([\w-]{11})"', h)
                   or re.search(r'property="og:url" content="https://www\.youtube\.com/watch\?v=([\w-]{11})"', h)
                   or re.search(r'"currentVideoEndpoint":\{[^{}]*?"watchEndpoint":\{"videoId":"([\w-]{11})"', h))
              st = re.search(r'"playabilityStatus":\{"status":"(\w+)"', h)
              estado = st.group(1) if st else "?"
              # /live solo muestra un video si el canal transmite ahora o tiene uno programado
              en_vivo = bool(m) and '"isUpcoming":true' not in h and estado != "LIVE_STREAM_OFFLINE"
              data[ch] = m.group(1) if en_vivo else ""
              print(nombre, "->", data[ch] or "no está en vivo", f"(estado {estado})")
          json.dump(data, open("live.json", "w"), indent=2)
      - name: Guardar cambios
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add live.json
          git diff --cached --quiet || (git commit -m "Actualizar videos en vivo" && git push)
